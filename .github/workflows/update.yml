name: 나라장터 대시보드 갱신

on:
  # 자동 실행 중지됨 (2026-11-06). 다시 켜려면 schedule 설정을 복구하세요.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 공고 수집 및 대시보드 생성
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python scripts/fetch.py
      - name: 변경 내용 저장
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "대시보드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
